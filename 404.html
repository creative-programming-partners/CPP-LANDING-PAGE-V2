  <!-- GitHub Pages sirve esta página en cualquier ruta que no existe, a cualquier profundidad.
       Por eso no usa rutas relativas: los estilos van aquí y el enlace al inicio se calcula. -->
  <script>
    (function () {
      var d = document.documentElement, theme;
      try { theme = localStorage.getItem('cpp-theme'); } catch (e) {}
      d.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root { --bg: #f7f8f8; --text: #071521; --text-2: #3e545f; --accent: #1d5ae0; --accent-hi: #123fa8; --steel: #607985; --line: #dde3e6; }
    :root[data-theme="dark"] { --bg: #050f17; --text: #f4f7f5; --text-2: #9aafb9; --accent: #5b8cff; --accent-hi: #82a8ff; --steel: #9aafb9; --line: #1a2d3b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, "Segoe UI", sans-serif;
    }
    main { width: min(560px, 100%); }
    svg { display: block; width: 44px; height: 44px; margin-bottom: 40px; }
    .m1 { fill: var(--accent); } .m2 { fill: var(--text); } .m3 { fill: var(--steel); }
    code { display: block; font: 500 13px/1 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--text-2); }
    h1 { margin: 14px 0 12px; font: 700 clamp(30px, 7vw, 48px)/1.08 ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: -.04em; }
    p { margin: 0; color: var(--text-2); max-width: 44ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; font-weight: 600; text-decoration: none; }
    .primary { background: var(--accent); color: var(--bg); }
    .primary:hover { background: var(--accent-hi); }
    .ghost { border: 1px solid var(--line); color: var(--text); }
    .ghost:hover { border-color: var(--accent); color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 128 128" aria-hidden="true">
      <path class="m1" d="M64 8 112 36 90 49 64 34 42 47 20 34Z"/>
      <path class="m2" d="M20 34 42 47v36l22 13v25L20 95Z"/>
      <path class="m3" d="m64 96 22-13V60l22-13v49l-44 25Z"/>
    </svg>
    <code>404</code>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Todo lo que buscas está en el inicio.</p>
    <div class="actions">
      <a class="primary" href="/" data-home>Ir al inicio</a>
      <a class="ghost" href="https://wa.me/51929363454">Escríbenos por WhatsApp</a>
    </div>
  </main>
  <script>
    // En github.io el sitio vive en /NOMBRE-DEL-REPO/; con dominio propio, en la raíz.
    var base = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/';
    document.querySelector('[data-home]').href = base;
  </script>
</body>
</html>
